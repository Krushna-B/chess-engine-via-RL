[project]
name = "chess-training"
version = "0.1.0"
description = "Self-play data, training, and model export pipeline for the chess engine"
readme = "README.md"
authors = [
    { name = "Krushna-B", email = "Krushna.Bhanushali@unc.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.5",
    "numpy>=2.5.2",
    "torch>=2.14.0",
]

[project.optional-dependencies]
tracking = ["wandb>=0.19.0"]

[project.scripts]
chess-training = "chess_training.run_loop:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
